name: Supabase Keep-Alive

# Runs every 5 days to prevent the free-tier Supabase project from pausing
# (Supabase pauses free projects after 7 days of inactivity)
on:
  schedule:
    - cron: '0 9 */5 * *'  # 9am UTC every 5 days
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Unexpected status $STATUS — Supabase may be unavailable"
            exit 1
          fi
          echo "Supabase is alive"
